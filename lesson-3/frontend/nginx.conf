server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend-3:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend CORS allows only the dev origin; spoof it so POST requests pass.
        proxy_set_header Origin "http://localhost:5173";
    }

    location /ws/ {
        proxy_pass http://backend-3:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Backend allows only the dev origin; spoof it so the WS handshake passes.
        proxy_set_header Origin "http://localhost:5173";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
